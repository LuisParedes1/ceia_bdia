schema: spec-driven

context: |
  Project: CEIA BDIA integrative generic student application.
  Repository role: educational course repository; clase_08/proyecto is the transformation target, while restored material_desarrollo/backend, material_desarrollo/frontend, and material_desarrollo/landing are immutable reuse sources. Adapt reusable infrastructure selectively; wholesale deletion or copying is forbidden.
  Intended architecture: separate public landing and authenticated frontend containers, backend API, PostgreSQL with pgvector and Row Level Security, MinIO object storage, generic SMTP/email recovery, multi-tenancy, users, roles and permissions, experiments, documents, and a tenant-safe assistant combining RAG with Text-to-SQL. Invitations are out of scope.
  Reference stack detected in prior course practices: Python/FastAPI-style services with requirements.txt, Next.js/React/TypeScript web applications, Docker Compose, PostgreSQL/pgvector, SQL migrations/scripts, and optional embedding services.
  Repository conventions: Docker Compose per practice, README documentation, shell automation, SQL scripts, and local-only environment examples. Existing instructional artifacts outside clase_08/proyecto are preserved.
  Delivery: auto-chain with a 600 changed-line review budget; split oversized implementation work into reviewable chained slices.

strict_tdd: false

testing:
  detected: 2026-08-20
  runner:
    available: false
    command: ""
    framework: ""
  layers:
    unit:
      available: false
      tool: ""
    integration:
      available: false
      tool: "Docker Compose commands and SQL verification scripts may be added with the application"
    e2e:
      available: false
      tool: ""
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: "npm run lint (frontend, when a frontend package is present)"
    type_checker:
      available: true
      command: "npx tsc --noEmit (frontend, when configured)"
    formatter:
      available: false
      command: ""

rules:
  proposal:
    - Transform clase_08/proyecto through selective adaptation from the immutable material_desarrollo source; explicitly classify retained, adapted, and removed code, preserving useful infrastructure while removing DVEM behavior.
    - Make tenancy, RLS, assistant data boundaries, and the no-invitations scope explicit.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords.
    - Specify tenant isolation for both relational and vector/document retrieval paths.
  design:
    - Document container boundaries, service contracts, persistence/storage responsibilities, and security assumptions.
    - Treat PostgreSQL RLS and least-privilege database roles as defense-in-depth, not merely application filters.
  tasks:
    - Organize work into reviewable slices compatible with the 600-line review budget and auto-chain delivery.
    - Include tests or executable verification for each security-sensitive behavior even though no project-wide runner currently exists.
  apply:
    rules:
      - Prefer Docker Compose, SQL verification scripts, and existing Python/Next.js conventions where implementation is introduced.
      - Apply changes only inside clase_08/proyecto. Never modify material_desarrollo. Reuse existing FastAPI, auth, recovery, frontend, landing, shadcn, utility, and test foundations where compatible; do not perform another wholesale cleanup.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "docker compose config"
    coverage_threshold: 0
  archive:
    - Record which restored components were retained or adapted and confirm that DVEM-specific behavior, secrets, production data, and integrations were excluded.
